<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все стримы | Архив</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link id="favicon" rel="icon" type="image/webp" href="emoji/emoji46.webp">
    <style>
        :root {
            --primary: #ff4500;
            --secondary: #ff8c00;
            --accent: #ff6347;
            --dark: #121212;
            --darker: #0a0a0a;
            --text: rgba(255, 255, 255, 0.9);
            --error: #ff4d4d;
            --success: #4dff7a;
            --all-color: #ff7e33;
            --warning: #ffcc00;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        ::-webkit-scrollbar {
          width: 12px;
          height: 12px;
        }

        ::-webkit-scrollbar-track {
        background: rgba(30, 30, 30, 0.9);
        }

        ::-webkit-scrollbar-thumb {
          background: linear-gradient(to bottom, #ff4500, #ff8c00);
          border-radius: 10px;
          border: 2px solid rgba(30, 30, 30, 0.6);
        }

        ::-webkit-scrollbar-thumb:hover {
          background: linear-gradient(to bottom, #ff6347, #ff4500);
        }
        
        body {
            background: linear-gradient(135deg, var(--darker), var(--dark));
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        
        header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeIn 0.8s 0.2s forwards;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }
        
        h1 {
            font-size: 2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 0.8s 0.3s forwards;
        }
        
        .search-container {
            flex: 1;
            min-width: 300px;
        }
        
        .search-input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 25px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 2px var(--primary);
        }
        
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .filter-btn, .year-btn {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .filter-btn::before, .year-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: all 0.5s ease;
        }
        
        .filter-btn:hover::before, .year-btn:hover::before {
            left: 100%;
        }
        
        .filter-btn:hover, .year-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .filter-btn.active, .year-btn.active {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            font-weight: 600;
        }
        
        .year-filter {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .year-btn {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .year-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .year-btn.active {
            background: var(--secondary);
            color: var(--darker);
        }
        
        .streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        
        .stream-card {
            position: relative;
            background: rgba(30, 30, 30, 0.4);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0;
            transform: translateY(20px);
            animation: cardEntry 0.6s forwards;
        }
        
        .stream-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 69, 0, 0.2);
            border-color: rgba(255, 140, 0, 0.3);
        }
        
        .stream-thumbnail {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-size: cover;
            background-position: center;
        }
        
        .stream-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .stream-info {
            padding: 1.2rem;
            position: relative;
        }
        
        .stream-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .stream-year {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .stream-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 50px;
        }
        
        .stream-date {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
        }
        
        .stream-status {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        
        .status-icon {
            margin-right: 0.5rem;
            font-size: 1.2rem;
        }
        
        .status-available {
            color: var(--success);
        }
        
        .status-unavailable {
            color: var(--error);
        }
        
        .status-checking {
            color: var(--warning);
        }
        
        .stream-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        .yt-icon-link {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            width: 40px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            object-fit: contain;
        }
        
        .yt-icon-link:hover {
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
        }
        
        .video-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-modal-container {
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 140, 0, 0.2);
        }
        
        .video-modal-container iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }
        
        .video-modal-close {
            position: fixed;
            top: 30px;
            right: 40px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            z-index: 1010;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-modal-close:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: rotate(90deg) scale(1.1);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }
        
        .error {
            color: var(--error);
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }
        
        .no-results {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }
        
        .falling-emoji-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        
        .falling-emoji {
            position: absolute;
            width: 30px;
            height: 30px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            will-change: transform;
        }

        .filter-btn, .year-btn {
            position: relative;
            padding-top: 28px;
        }

        .filter-count, .year-count {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 700;
            z-index: 10;
            min-width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 0 8px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filter-btn[data-filter="all"] .filter-count {
            background: var(--all-color);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 126, 51, 0.5);
        }

        .filter-btn[data-filter="available"] .filter-count {
            background: var(--success);
            color: #003311;
            box-shadow: 0 0 10px rgba(77, 255, 122, 0.5);
        }

        .filter-btn[data-filter="unavailable"] .filter-count {
            background: var(--error);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }

        .year-count {
            background: var(--secondary);
            color: var(--darker);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        @media (max-width: 768px) {
            .streams-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .search-container {
                min-width: 100%;
            }

            .filter-count, .year-count {
                font-size: 12px;
                min-width: 20px;
                height: 20px;
                border-radius: 10px;
            }

            .filter-btn, .year-btn {
                padding-top: 24px;
            }

            .video-modal-container {
                width: 95%;
            }

            .video-modal-close {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes cardEntry {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="falling-emoji-container" id="emoji-container"></div>
    
    <div class="container">
        <header>
            <button class="back-button" onclick="goBack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h1>Все стримы</h1>
        </header>
        
        <div class="controls">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Поиск по названию, номеру или дате..." id="searchInput">
            </div>
            
            <div class="filters">
                <div class="year-filter">
                    <button class="year-btn active" data-year="all">Все годы</button>
                    <button class="year-btn" data-year="2022">2022</button>
                    <button class="year-btn" data-year="2023">2023</button>
                    <button class="year-btn" data-year="2024">2024</button>
                    <button class="year-btn" data-year="2025">2025</button>
                    <button class="year-btn" data-year="2026">2026</button>
                </div>
                
                <div class="status-filter">
                    <button class="filter-btn active" data-filter="all">Все стримы</button>
                    <button class="filter-btn" data-filter="available">Доступные</button>
                    <button class="filter-btn" data-filter="unavailable">Недоступные</button>
                </div>
            </div>
        </div>
        
        <div class="streams-grid" id="streamsContainer">
            <div class="loading">Загрузка данных о стримах...</div>
        </div>
    </div>

    <div class="video-modal-overlay" id="videoModalOverlay">
        <button class="video-modal-close" id="closeVideoModal">&times;</button>
        <div class="video-modal-container" id="videoModalContainer">
            <iframe id="youtubeIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yearsToLoad = ['2022', '2023', '2024', '2025', '2026'];
            let allStreams = [];
            let currentFilter = 'all';
            let currentYearFilter = 'all';
            let currentSearch = '';
            
            const emojiContainer = document.getElementById('emoji-container');
            const activeEmojis = [];
            let emojiInterval = null;
            let lastAnimationFrame = null;

            const modalOverlay = document.getElementById('videoModalOverlay');
            const modalContainer = document.getElementById('videoModalContainer');
            const iframePlayer = document.getElementById('youtubeIframe');
            const closeModalBtn = document.getElementById('closeVideoModal');
            let modalOpen = false;
            let modalCloseTimer = null;

            const STATUS_KEY = 'cryptoYTStatus_v3';
            const STATUS_TTL = 604800000;
            const CHECK_LIMIT = 6;
            let statusCache = readStatusCache();
            let statusCacheDirty = false;

            function readStatusCache() {
                try {
                    const raw = localStorage.getItem(STATUS_KEY);
                    const parsed = raw ? JSON.parse(raw) : null;
                    return parsed && typeof parsed === 'object' ? parsed : {};
                } catch (e) {
                    return {};
                }
            }

            function saveStatusCache(force) {
                if (!statusCacheDirty && !force) return;
                statusCacheDirty = false;
                const ids = Object.keys(statusCache);
                if (ids.length > 1500) {
                    ids.sort((a, b) => (statusCache[a].t || 0) - (statusCache[b].t || 0));
                    ids.slice(0, ids.length - 1500).forEach(id => { delete statusCache[id]; });
                }
                try {
                    localStorage.setItem(STATUS_KEY, JSON.stringify(statusCache));
                } catch (e) {}
            }

            function cachedStatus(videoId) {
                const entry = statusCache[videoId];
                if (!entry || typeof entry.t !== 'number') return null;
                return { available: !!entry.a, fresh: Date.now() - entry.t < STATUS_TTL };
            }

            function createStreamEntry(number, url, date, videoId, title, year) {
                const cached = videoId ? cachedStatus(videoId) : null;
                const stream = {
                    number: number,
                    url: url,
                    date: date,
                    videoId: videoId,
                    title: title,
                    year: year,
                    status: 'checking',
                    statusIcon: '⏳'
                };
                if (cached) {
                    stream.status = cached.available ? 'available' : 'unavailable';
                    stream.statusIcon = cached.available ? '✅' : '❌';
                }
                return stream;
            }

            function openVideoModal(videoId, originalUrl) {
                if (!videoId) {
                    window.open(originalUrl, '_blank', 'noopener');
                    return;
                }
                if (modalCloseTimer) {
                    clearTimeout(modalCloseTimer);
                    modalCloseTimer = null;
                }
                iframePlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                modalOverlay.style.display = 'flex';
                modalOpen = true;
                setTimeout(() => {
                    modalOverlay.style.opacity = '1';
                    modalContainer.style.transform = 'scale(1)';
                }, 10);
                document.body.style.overflow = 'hidden';
            }

            function closeVideoModal() {
                if (!modalOpen) return;
                modalOpen = false;
                modalOverlay.style.opacity = '0';
                modalContainer.style.transform = 'scale(0.95)';
                document.body.style.overflow = '';
                if (modalCloseTimer) clearTimeout(modalCloseTimer);
                modalCloseTimer = setTimeout(() => {
                    modalCloseTimer = null;
                    modalOverlay.style.display = 'none';
                    iframePlayer.removeAttribute('src');
                }, 300);
            }

            function goBack() {
                if (modalOpen) {
                    closeVideoModal();
                    return;
                }
                const referrer = document.referrer;
                if (referrer && referrer.indexOf(location.host) !== -1 && history.length > 1) {
                    history.back();
                    return;
                }
                location.href = 'index.html';
            }

            window.goBack = goBack;

            closeModalBtn.addEventListener('click', closeVideoModal);
            modalOverlay.addEventListener('click', (event) => {
                if (event.target === modalOverlay) closeVideoModal();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modalOpen) closeVideoModal();
            });
            window.addEventListener('pagehide', () => saveStatusCache(true));
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) saveStatusCache(true);
            });

            let faviconInterval = null;
            function startFaviconCycle() {
                if (faviconInterval) clearInterval(faviconInterval);
                let emojiIndex = 0;
                const updateFavicon = () => {
                    const favicon = document.getElementById('favicon');
                    favicon.href = getRandomEmoji();
                    emojiIndex = (emojiIndex + 1) % 50;
                };
                updateFavicon();
                faviconInterval = setInterval(updateFavicon, 10000);
            }

            function getRandomEmoji() {
                return `emoji/emoji${Math.floor(Math.random() * 50)}.webp`;
            }
            
            function createFallingEmoji() {
                if (document.hidden) return;
                
                const emoji = document.createElement('div');
                emoji.className = 'falling-emoji';
                emoji.style.backgroundImage = `url('${getRandomEmoji()}')`;
                const size = 20 + Math.random() * 20;
                const range = Math.max(0, (document.documentElement.clientWidth || window.innerWidth) - size - 4);
                emoji.style.left = `${4 + Math.random() * range}px`;
                emoji.style.top = '0';
                emoji.style.transform = `translate3d(0, -30px, 0) rotate(${-30 + Math.random() * 60}deg)`;
                emoji.style.width = `${size}px`;
                emoji.style.height = `${size}px`;
                emojiContainer.appendChild(emoji);
                
                const emojiData = {
                    element: emoji,
                    speed: 0.5 + Math.random() * 2.5,
                    position: -30,
                    rotation: -30 + Math.random() * 60,
                    rotationSpeed: (Math.random() - 0.5) * 10,
                    removed: false
                };
                activeEmojis.push(emojiData);
                
                if (!lastAnimationFrame) animateEmojis();
                setTimeout(() => { if (!emojiData.removed) removeEmoji(emojiData); }, 10000);
            }
            
            function animateEmojis() {
                const viewportHeight = window.innerHeight;
                
                for (let i = activeEmojis.length - 1; i >= 0; i--) {
                    const emoji = activeEmojis[i];
                    
                    if (emoji.removed) {
                        activeEmojis.splice(i, 1);
                        continue;
                    }
                    
                    emoji.position += emoji.speed * 2;
                    emoji.rotation += emoji.rotationSpeed;
                    emoji.element.style.transform = `translate3d(0, ${emoji.position}px, 0) rotate(${emoji.rotation}deg)`;
                    
                    if (!emoji.colliding && emoji.position > viewportHeight - 280) {
                        const fade = Math.max(0, Math.min(1, (viewportHeight - emoji.position) / 280));
                        emoji.element.style.opacity = Math.pow(fade, 1.6).toFixed(3);
                    }
                    
                    if (emoji.position > viewportHeight) {
                        removeEmoji(emoji);
                        continue;
                    }
                    
                    const emojiRect = emoji.element.getBoundingClientRect();
                    const target = document.elementFromPoint(emojiRect.left + emojiRect.width / 2, emojiRect.top + emojiRect.height / 2);
                    
                    if (target && target.closest && target.closest('.stream-card, h1, .search-input, .filter-btn, .year-btn')) {
                        handleCollision(emoji);
                    }
                }
                
                if (activeEmojis.length > 0) {
                    lastAnimationFrame = requestAnimationFrame(animateEmojis);
                } else {
                    lastAnimationFrame = null;
                }
            }
            
            function handleCollision(emoji) {
                if (emoji.colliding) return;
                emoji.colliding = true;
                emoji.element.style.transition = 'transform 0.1s, opacity 0.5s';
                emoji.element.style.transform = `translate3d(0, ${emoji.position - 5}px, 0) rotate(${emoji.rotation}deg)`;
                emoji.element.style.opacity = '0';
                
                setTimeout(() => {
                    removeEmoji(emoji);
                }, 500);
            }
            
            function removeEmoji(emoji) {
                if (emoji.removed) return;
                
                emoji.removed = true;
                if (emoji.element.parentNode) {
                    emoji.element.parentNode.removeChild(emoji.element);
                }
            }
            
            function startEmojiSystem() {
                if (emojiInterval) clearInterval(emojiInterval);
                emojiInterval = setInterval(createFallingEmoji, 700 + Math.random() * 300);
                
                activeEmojis.forEach(emoji => removeEmoji(emoji));
                activeEmojis.length = 0;
                
                setTimeout(() => { 
                    for (let i = 0; i < 5; i++) setTimeout(createFallingEmoji, i * 200); 
                }, 1000);
            }

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (emojiInterval) clearInterval(emojiInterval);
                    emojiInterval = null;
                    if (lastAnimationFrame) {
                        cancelAnimationFrame(lastAnimationFrame);
                        lastAnimationFrame = null;
                    }
                } else {
                    startEmojiSystem();
                }
            });
            
            startEmojiSystem();
            startFaviconCycle();
            
            function countFilteredStreams(filteredStreams = allStreams) {
                const available = filteredStreams.filter(s => s.status === 'available').length;
                const unavailable = filteredStreams.filter(s => s.status === 'unavailable').length;
                const all = filteredStreams.length;
                return { available, unavailable, all };
            }

            function countStreamsByYear() {
                const counts = {};
                yearsToLoad.forEach(year => {
                    counts[year] = allStreams.filter(s => s.year === year).length;
                });
                counts['all'] = allStreams.length;
                return counts;
            }

            function updateCounters() {
                const filteredStreams = allStreams.filter(stream => {
                    const yearMatch = currentYearFilter === 'all' || stream.year === currentYearFilter;
                    const searchMatch = !currentSearch || 
                        stream.title.toLowerCase().includes(currentSearch) || 
                        stream.number.includes(currentSearch) || 
                        stream.date.includes(currentSearch) ||
                        stream.year.includes(currentSearch);
                    return yearMatch && searchMatch;
                });

                const counts = countFilteredStreams(filteredStreams);
                const yearCounts = countStreamsByYear();
                
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    const countEl = btn.querySelector('.filter-count');
                    if (countEl) {
                        const type = btn.dataset.filter;
                        if (type === 'all') countEl.textContent = counts.all;
                        else if (type === 'available') countEl.textContent = counts.available;
                        else if (type === 'unavailable') countEl.textContent = counts.unavailable;
                    }
                });

                document.querySelectorAll('.year-btn').forEach(btn => {
                    const countEl = btn.querySelector('.year-count');
                    if (countEl) {
                        const year = btn.dataset.year;
                        countEl.textContent = yearCounts[year] || 0;
                    }
                });
            }

            function addCountersToFilters() {
                const counts = countFilteredStreams();
                const yearCounts = countStreamsByYear();
                
                const filterButtons = document.querySelectorAll('.filter-btn');
                filterButtons.forEach(btn => {
                    const old = btn.querySelector('.filter-count');
                    if (old) old.remove();
                    
                    let count = 0;
                    const type = btn.dataset.filter;
                    if (type === 'all') count = counts.all;
                    else if (type === 'available') count = counts.available;
                    else if (type === 'unavailable') count = counts.unavailable;
                    
                    const countEl = document.createElement('div');
                    countEl.className = 'filter-count';
                    countEl.textContent = count;
                    btn.appendChild(countEl);
                });

                const yearButtons = document.querySelectorAll('.year-btn');
                yearButtons.forEach(btn => {
                    const old = btn.querySelector('.year-count');
                    if (old) old.remove();
                    
                    const year = btn.dataset.year;
                    const count = yearCounts[year] || 0;
                    
                    const countEl = document.createElement('div');
                    countEl.className = 'year-count';
                    countEl.textContent = count;
                    btn.appendChild(countEl);
                });
            }
            
            initSearch();
            initFilters();
            initYearFilters();
            initCards();
            loadAllStreams();
            
            async function loadAllStreams() {
                const streamsContainer = document.getElementById('streamsContainer');
                streamsContainer.innerHTML = '<div class="loading">Сбор данных из годовых файлов...</div>';
                
                allStreams = [];
                
                try {
                    const fetchPromises = yearsToLoad.map(async (year) => {
                        const res = await fetch(`${year}.html`);
                        if (!res.ok) return [];
                        const html = await res.text();
                        
                        const match = html.match(/const streamsData = `([\s\S]*?)`;/);
                        if (!match) return [];
                        
                        return parseStreamsData(match[1], year);
                    });
                    
                    const results = await Promise.all(fetchPromises);
                    results.forEach(streams => {
                        allStreams = allStreams.concat(streams);
                    });
                    
                    const uniqueStreams = [];
                    const seen = new Set();
                    allStreams.forEach(s => {
                        if (!seen.has(s.url)) {
                            seen.add(s.url);
                            uniqueStreams.push(s);
                        }
                    });
                    allStreams = uniqueStreams;
                    
                    allStreams.sort((a, b) => {
                        const dateA = parseDate(a.date);
                        const dateB = parseDate(b.date);
                        return dateB - dateA;
                    });
                    
                    addCountersToFilters();
                    renderStreams();
                    checkAllStreams();
                    
                } catch (error) {
                    console.error('Ошибка при загрузке файлов:', error);
                    streamsContainer.innerHTML = '<div class="error">Не удалось собрать данные. Проверьте, что вы на GitHub Pages.</div>';
                }
            }
            
            function parseStreamsData(data, year) {
                const lines = data.split('\n');
                const streams = [];
                
                lines.forEach((line) => {
                    line = line.trim();
                    if (!line) return;
                    
                    const match = line.match(/^#(\d+)\s+(https?:\/\/\S+)\s+(\d{2}\.\d{2}\.\d{4})\s+(.*)$/);
                    if (match) {
                        const number = match[1];
                        const url = match[2];
                        const date = match[3];
                        const title = match[4];
                        
                        const videoIdMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
                        const videoId = videoIdMatch ? videoIdMatch[1] : '';
                        
                        streams.push(createStreamEntry(number, url, date, videoId, title, year));
                    }
                });
                
                return streams;
            }
            
            async function checkStreamStatus(stream) {
                const videoId = stream.videoId;
                if (!videoId) {
                    stream.status = 'unavailable';
                    stream.statusIcon = '❌';
                    return;
                }
                const cached = cachedStatus(videoId);
                if (cached && cached.fresh) return;
                let res = null;
                try {
                    res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`, { cache: 'no-store' });
                } catch (e) {
                    if (!cached) {
                        stream.status = 'unavailable';
                        stream.statusIcon = '❌';
                    }
                    return;
                }
                if (res.ok) {
                    stream.status = 'available';
                    stream.statusIcon = '✅';
                    statusCache[videoId] = { a: 1, t: Date.now() };
                    statusCacheDirty = true;
                } else if (res.status === 404 || res.status === 401) {
                    stream.status = 'unavailable';
                    stream.statusIcon = '❌';
                    statusCache[videoId] = { a: 0, t: Date.now() };
                    statusCacheDirty = true;
                } else if (!cached) {
                    stream.status = 'unavailable';
                    stream.statusIcon = '❌';
                }
            }

            function refreshCard(stream) {
                if (!stream.videoId) return;
                const card = document.querySelector(`.stream-card[data-vid="${stream.videoId}"]`);
                if (!card) return;
                card.classList.remove('checking', 'available', 'unavailable');
                card.classList.add(stream.status);
                const icon = card.querySelector('.status-icon');
                if (icon) {
                    icon.className = `status-icon status-${stream.status}`;
                    icon.textContent = stream.statusIcon;
                }
                const label = card.querySelector('.stream-status span:last-child');
                if (label) {
                    label.textContent = stream.status === 'available' ? 'Доступен' : (stream.status === 'unavailable' ? 'Недоступен' : 'Проверка...');
                }
            }

            async function checkAllStreams() {
                const pending = allStreams.filter(stream => {
                    if (!stream.videoId) return false;
                    const cached = cachedStatus(stream.videoId);
                    return !cached || !cached.fresh;
                });
                if (pending.length === 0) {
                    updateCounters();
                    return;
                }
                let cursor = 0;
                let done = 0;
                const worker = async () => {
                    while (cursor < pending.length) {
                        const stream = pending[cursor++];
                        await checkStreamStatus(stream);
                        refreshCard(stream);
                        done++;
                        if (done % 10 === 0) {
                            updateCounters();
                            saveStatusCache();
                        }
                    }
                };
                const runners = [];
                for (let i = 0; i < Math.min(CHECK_LIMIT, pending.length); i++) runners.push(worker());
                await Promise.all(runners);
                saveStatusCache();
                updateCounters();
            }
            
            function parseDate(dateString) {
                const [day, month, year] = dateString.split('.').map(Number);
                return new Date(year, month - 1, day);
            }
            
            function renderStreams() {
                const streamsContainer = document.getElementById('streamsContainer');
                streamsContainer.innerHTML = '';
                
                const filteredStreams = allStreams.filter(stream => {
                    const statusMatch = currentFilter === 'all' || stream.status === currentFilter;
                    const yearMatch = currentYearFilter === 'all' || stream.year === currentYearFilter;
                    const searchMatch = !currentSearch || 
                        stream.title.toLowerCase().includes(currentSearch) || 
                        stream.number.includes(currentSearch) || 
                        stream.date.includes(currentSearch) ||
                        stream.year.includes(currentSearch);
                    
                    return statusMatch && yearMatch && searchMatch;
                });
                
                updateCounters();
                
                if (filteredStreams.length === 0) {
                    streamsContainer.innerHTML = '<div class="no-results">Ничего не найдено</div>';
                    return;
                }
                
                filteredStreams.forEach((stream, index) => {
                    createStreamCard(stream, index);
                });
            }
            
            function createStreamCard(stream, index) {
                const streamsContainer = document.getElementById('streamsContainer');
                const card = document.createElement('div');
                card.className = `stream-card ${stream.status}`;
                card.style.animationDelay = `${0.2 + (index % 15) * 0.05}s`;
                
                let statusText = 'Проверка...';
                let statusClass = 'status-checking';
                if (stream.status === 'available') {
                    statusText = 'Доступен';
                    statusClass = 'status-available';
                } else if (stream.status === 'unavailable') {
                    statusText = 'Недоступен';
                    statusClass = 'status-unavailable';
                }
                
                card.innerHTML = `
                    <div class="stream-number">#${stream.number}</div>
                    <div class="stream-year">${stream.year}</div>
                    <div class="stream-thumbnail"><img src="https://img.youtube.com/vi/${stream.videoId}/mqdefault.jpg" alt="" loading="lazy" decoding="async"></div>
                    <div class="stream-info">
                        <div class="stream-title">${stream.title || 'Название недоступно'}</div>
                        <div class="stream-date">${stream.date}</div>
                        <div class="stream-status">
                            <span class="status-icon ${statusClass}">${stream.statusIcon}</span>
                            <span>${statusText}</span>
                        </div>
                        <img src="assets/avatars/youtube.webp" class="yt-icon-link" alt="YouTube" title="Открыть на YouTube">
                    </div>
                    <a href="${stream.url}" class="stream-link" target="_blank"></a>
                `;

                card.dataset.vid = stream.videoId || '';
                card.dataset.url = stream.url;

                streamsContainer.appendChild(card);
            }

            function initCards() {
                const streamsContainer = document.getElementById('streamsContainer');
                streamsContainer.addEventListener('click', (event) => {
                    const card = event.target.closest('.stream-card');
                    if (!card) return;
                    const url = card.dataset.url || '';
                    if (event.target.closest('.yt-icon-link')) {
                        event.preventDefault();
                        window.open(url, '_blank', 'noopener');
                        return;
                    }
                    if (event.target.closest('.stream-link')) {
                        event.preventDefault();
                        openVideoModal(card.dataset.vid || '', url);
                    }
                });
            }
            
            function initSearch() {
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', function() {
                    currentSearch = this.value.toLowerCase().trim();
                    renderStreams();
                });
            }
            
            function initFilters() {
                const filterButtons = document.querySelectorAll('.filter-btn');
                
                filterButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        filterButtons.forEach(btn => btn.classList.remove('active'));
                        this.classList.add('active');
                        
                        currentFilter = this.dataset.filter;
                        renderStreams();
                    });
                });
            }
            
            function initYearFilters() {
                const yearButtons = document.querySelectorAll('.year-btn');
                
                yearButtons.forEach(button => {
                    button.addEventListener('click', function() {
                        yearButtons.forEach(btn => btn.classList.remove('active'));
                        this.classList.add('active');
                        
                        currentYearFilter = this.dataset.year;
                        renderStreams();
                    });
                });
            }
        });
    </script>
</body>
</html>
